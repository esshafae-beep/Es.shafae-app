<title>دفترچه تلفن هنرستان شهید خدمتی</title><style>
:root{--bg:#f5f2ea;--card:#fff;--tx:#1b2438;--mu:#7a8296;--nv:#14284b;--nv2:#1f3a6b;--gd:#c9a24a;--ln:#e6e0d2;--ok:#2e8f5b;--rd:#c94545;--alt:#e4ebf7;--sh:0 2px 10px #14284b14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--card:#17213a;--tx:#eef1f8;--mu:#97a1b8;--nv:#0b1a38;--nv2:#2a4a85;--ln:#27324d;--alt:#223356;--sh:0 2px 10px #0006}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nv);z-index:30}
button{font-family:inherit;font-size:15px;cursor:pointer}
.top{background:linear-gradient(160deg,var(--nv),var(--nv2));color:#fff;padding:16px 16px 62px;border-bottom:3px solid var(--gd);border-radius:0 0 26px 26px;position:relative}
.brand{display:flex;align-items:center;gap:12px;max-width:640px;margin:auto}
.brand img{width:62px;height:62px;border-radius:50%;border:2px solid var(--gd);background:#fff;flex:none}
.brand h1{margin:0;font-size:18px;line-height:1.5}
.brand p{margin:0;font-size:13px;color:#e9d9a8}
.menu{margin-right:auto;background:#ffffff22;border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px}
main{padding:0 14px 100px;max-width:640px;margin:-44px auto 0;position:relative}
.sbox{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:10px}
input,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:16px}
.chips{display:flex;gap:7px;margin-top:9px;overflow-x:auto;padding-bottom:2px}
.chips label{padding:6px 13px;border-radius:20px;background:var(--bg);font-size:14px;white-space:nowrap;color:var(--mu);border:1px solid var(--ln)}
.chips input{display:none}
.chips label:has(input:checked){background:var(--nv);color:#fff;border-color:var(--gd)}
.cnt{color:var(--mu);font-size:13px;margin:14px 4px 6px}
.row{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:11px 12px;display:flex;gap:12px;align-items:center;margin-bottom:9px;cursor:pointer}
.row:active{transform:scale(.99)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
.row .t{flex:1;min-width:0}
.row b{display:block;font-weight:600}
.row small{color:var(--mu)}
.row i{color:var(--gd);font-style:normal;font-size:22px}
.fab{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:56px;padding:0 20px;border-radius:28px;border:0;background:var(--gd);color:#14284b;font-weight:700;font-size:16px;box-shadow:0 4px 14px #0004;z-index:8}
.sheet{position:fixed;inset:0;background:#0a1226aa;display:none;align-items:flex-end;z-index:40}
.sheet.on{display:flex}
.box{background:var(--card);width:100%;max-width:640px;margin:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.box::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--ln);margin:6px auto 12px}
.box h2{margin:0 0 8px;font-size:19px;color:var(--nv)}
@media (prefers-color-scheme:dark){.box h2{color:#fff}}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--ln);font-size:15px}
.kv span:first-child{color:var(--mu)}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:var(--nv);color:#fff;margin-top:10px;font-size:16px}
.btn.g{background:var(--ok);font-size:18px}.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}.btn.r{background:var(--rd)}
.call{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--ln);border-radius:14px;margin-top:9px;text-decoration:none;color:var(--tx);background:var(--bg)}
.call span::before{content:"📞 "}
.call b{direction:ltr;color:var(--ok);font-size:17px}
.f{margin-top:9px}.f label{font-size:13px;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{direction:ltr;text-align:right}
.empty{text-align:center;color:var(--mu);padding:46px 10px;line-height:2}
[hidden]{display:none!important}
.brandbtn{display:flex;align-items:center;gap:12px;background:none;border:0;color:#fff;padding:0;text-align:right;font-family:inherit}
.bg{position:fixed;top:50%;left:50%;width:92vw;max-width:520px;transform:translate(-50%,-45%);opacity:0;pointer-events:none;z-index:0;border-radius:50%;transition:opacity .3s;-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 72%);mask-image:radial-gradient(circle,#000 58%,transparent 72%)}
.bg.on{opacity:.16}
main{z-index:1}
.home{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:20px 16px 22px;margin-top:6px}
.home h3{margin:0 0 4px;font-size:15px;color:var(--mu);font-weight:500}
.home select{margin:6px 0 16px;padding:14px;font-size:16px}
.hb{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:9px}
.hb button{padding:15px 4px;border:0;border-radius:14px;font-size:16px;font-weight:600;color:#fff;background:var(--nv);box-shadow:var(--sh)}
.hb .all{background:var(--gd);color:#14284b}.hb .ex{background:#8a93a8}
.call{padding:10px 14px}
.call small{display:block;color:var(--mu);font-size:13px}
.call i{font-style:normal;width:44px;height:44px;border-radius:50%;background:var(--ok);display:grid;place-items:center;font-size:20px}
.call b{display:block;margin-top:2px}
.ph{margin:14px 0 0;font-size:15px;color:var(--mu);font-weight:500}
.call .pi{font-size:30px;width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none;margin-left:12px}.call div{flex:1}.call span::before{content:none}
.row small{display:block}.row:nth-child(even){background:var(--alt)}
/* menu & add enabled */

/* Phase 1 enhancements */
/* Phase 2 + Birthday + Attendance */
.home-extra{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.home-extra button{padding:16px 8px;border:0;border-radius:14px;font-size:15px;font-weight:600;color:#fff;background:var(--nv);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:6px}
.home-extra button span{font-size:22px}
.home-extra .bday{background:linear-gradient(135deg,#c2185b,#e91e63)}
.home-extra .att{background:linear-gradient(135deg,#1565c0,#1976d2)}
.bday-card,.att-row{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid var(--ln);display:flex;align-items:center;gap:10px}
.bday-card .info{flex:1}
.bday-card .sms{background:#3a63b8;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit;cursor:pointer}
.att-row label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer}
.att-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--rd)}
.note-box{width:100%;min-height:70px;padding:10px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:14px;resize:vertical}
.date-row{display:flex;gap:8px;margin:10px 0;align-items:center}
.date-row select,.date-row input{flex:1}
.month-report{margin-top:12px}
.report-item{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--ln);font-size:14px}
.report-item b{color:var(--rd)}

.actions{display:flex;gap:8px;margin-top:10px}
.actions a,.actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 6px;border-radius:12px;border:0;font-size:13px;font-weight:600;text-decoration:none;color:#fff;cursor:pointer;font-family:inherit}
.actions .call-btn{background:var(--ok)}
.actions .sms-btn{background:#3a63b8}
.actions .copy-btn{background:#6b7280}
.phone-card{padding:12px 14px;border:1px solid var(--ln);border-radius:14px;margin-top:10px;background:var(--bg)}
.phone-card .head{display:flex;align-items:center;gap:10px}
.phone-card .pi{font-size:26px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.phone-card .info{flex:1}
.phone-card small{display:block;color:var(--mu);font-size:12px}
.phone-card b.num{display:block;direction:ltr;text-align:right;font-size:17px;margin-top:2px}
.phone-card.mob .pi{background:#e8f5e9}.phone-card.mob b{color:#2e8f5b}
.phone-card.dad .pi{background:#e3f2fd}.phone-card.dad b{color:#1565c0}
.phone-card.mom .pi{background:#fce4ec}.phone-card.mom b{color:#c2185b}
.phone-card.home .pi{background:#f5f5f5}.phone-card.home b{color:#616161}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1b2438;color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 20px #0004}
.toast.show{opacity:1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat-card{background:var(--bg);border-radius:14px;padding:14px;text-align:center;border:1px solid var(--ln)}
.stat-card b{display:block;font-size:22px;color:var(--nv);margin-bottom:4px}
.stat-card span{font-size:12px;color:var(--mu)}
.miss-list{margin-top:12px}
.miss-item{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;gap:8px}
.miss-item .tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 8px;border-radius:20px;background:#fdecea;color:#c94545}
.tag.ok{background:#e8f5e9;color:#2e8f5b}


.brand h1{font-size:22px!important;line-height:1.5}.brand p{font-size:16px!important;color:#f1d98a!important;margin-top:2px}
.tabs{display:flex;gap:8px;margin:0 0 10px;position:relative;z-index:2}
.tabs button{flex:1;border:0;border-radius:14px;padding:12px 4px;font-size:14px;font-weight:700;color:#fff;opacity:.6;box-shadow:var(--sh)}
.tabs button.on{opacity:1;transform:translateY(-2px);box-shadow:0 5px 12px #0004}
.tb1,.g1{background:linear-gradient(135deg,var(--t1,#5e35b1),var(--t2,#8e63d6))}.tb2,.g2{background:linear-gradient(135deg,#c2185b,#ec407a)}.tb3,.g3{background:linear-gradient(135deg,#1565c0,#2196f3)}.g4{background:linear-gradient(135deg,#00796b,#26a69a)}
.big{position:relative;display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:22px;padding:20px 18px;margin-bottom:13px;color:#fff;text-align:right;box-shadow:0 6px 16px #0003;font-family:inherit}
.big:active{transform:scale(.985)}
.big .e{font-size:38px;flex:none;width:58px;text-align:center}
.big b{display:block;font-size:20px}.big small{display:block;opacity:.88;font-size:12.5px;margin-top:5px;line-height:1.8;font-weight:400}
.big .bdg{position:absolute;top:10px;left:12px;background:#fff;color:#c2185b;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:700}
.g5{background:linear-gradient(135deg,#e65100,#ffa726)}
.g4,.g5{padding:14px 18px}.g5 .e{font-size:28px}.g5 b{font-size:17px}.g4 .e{font-size:28px}.g4 b{font-size:17px}

.pgx{padding-top:2px}
body.inner main{margin-top:12px!important}
body.inner .top{padding-bottom:16px!important}

#tabBack{flex:none!important;width:46px;background:var(--card)!important;color:var(--nv)!important;opacity:1!important;font-size:20px;border:1px solid var(--ln)!important}
:root[data-theme="dark"] #tabBack{color:#fff!important}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.sw{border:0;border-radius:14px;height:64px;color:#fff;font-weight:700;font-family:inherit;font-size:14px}
.promo{margin-top:14px;border:2px dashed var(--gd);border-radius:18px;padding:14px;text-align:center;background:var(--bg);line-height:1.9}
.promo b{display:block;font-size:16px;color:var(--nv)}.promo span{display:block;font-size:12.5px;color:var(--mu)}
.promo a{display:inline-block;margin-top:6px;background:var(--gd);color:#14284b;padding:8px 16px;border-radius:12px;font-weight:700;text-decoration:none;direction:ltr}
:root[data-theme="dark"] .promo b{color:#fff}

.pc .pa a,.pc .pa button{color:var(--mu)}
.pc .pa svg{width:21px;height:21px}
.pc .pa .b1{background:#dff3e7;color:#2a8a55}.pc .pa .b2{background:#e0ecff;color:#2f6fd0}.pc .pa .b3{background:var(--card);color:#6b7280}
.pc.mob{--c:#86d1a4}
:root[data-theme="dark"] .pc .pa .b1{background:#1d3d2d;color:#7fd4a2}:root[data-theme="dark"] .pc .pa .b2{background:#1b2d50;color:#8fb5f5}
.bday-card .sms{display:inline-flex;align-items:center;gap:5px;background:#e0ecff;color:#2f6fd0;border-radius:12px;padding:8px 12px;text-decoration:none;font-weight:700;font-size:14px}
.bday-card .sms svg{width:19px;height:19px}
.dlbl{margin-top:6px;color:var(--nv2);font-weight:700;text-align:center;direction:rtl}
:root[data-theme="dark"] .dlbl{color:#9fc0ff}
.fu-btn{background:linear-gradient(135deg,#e65100,#ffa726)}
.ta{width:100%;padding:10px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:16px}
.fu{border:1px solid var(--ln);border-radius:12px;padding:9px 12px;margin-top:8px;position:relative;line-height:1.8}
.fu .x{position:absolute;left:8px;top:6px;border:0;background:none;color:var(--rd);font-size:12px}
#printArea{display:none}
@media print{@page{size:A4 landscape;margin:9mm}body>*:not(#printArea){display:none!important}#printArea{display:block!important;direction:rtl;color:#000;background:#fff;font-size:10pt}

.pt{width:100%;border-collapse:collapse}.pt th,.pt td{border:1px solid #444;padding:1.6mm 2mm;text-align:center}.pt thead{display:table-header-group}.pt tr{page-break-inside:avoid}.pt th{background:#e4e4e4}.pt td.n{direction:ltr}}


:root[data-theme="dark"]{--bg:#0e1524;--card:#17213a;--tx:#eef1f8;--mu:#97a1b8;--nv:#0b1a38;--nv2:#2a4a85;--ln:#27324d;--alt:#223356;--sh:0 2px 10px #0006}
.hbtns{margin-right:auto;display:flex;gap:8px}.hbtns .menu{margin:0}
.dateline{text-align:center;color:var(--tx);font-size:18px;font-weight:800;margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tile{position:relative;border:0;border-radius:16px;padding:14px 6px 12px;background:var(--bg);color:var(--tx);box-shadow:var(--sh);font-size:13.5px;font-weight:600;border:1px solid var(--ln)}
.tile span.e{display:block;font-size:30px;margin-bottom:4px}
.tile .bdg{position:absolute;top:6px;left:8px;background:#e0457b;color:#fff;border-radius:12px;min-width:22px;height:22px;line-height:22px;font-size:12px}
.pc{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-right:5px solid var(--c);border-radius:14px;padding:9px 10px;margin-top:9px;background:var(--bg)}
.pc.mob{--c:#2e8f5b}.pc.dad{--c:#3a63b8}.pc.mom{--c:#d0457f}.pc.home{--c:#c27a1d}
.pc .pi{font-size:28px;width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.pc .pn{flex:1;min-width:0}.pc .pn small{display:block;color:var(--mu);font-size:12.5px}.pc .pn b{font-size:16px}
.pc .pa{display:flex;gap:6px}.pc .pa a,.pc .pa button{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;text-decoration:none;font-size:18px;background:var(--card);box-shadow:var(--sh)}
#lock,#expired{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--nv),var(--nv2));display:grid;place-items:center;padding:20px}
.lk{background:var(--card);border-radius:22px;padding:24px 20px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 30px #0006;border-top:4px solid var(--gd)}
.lk img{width:92px;height:92px;border-radius:50%;border:2px solid var(--gd)}
.lk h2{margin:10px 0 14px;font-size:17px}.lk input{margin-top:8px;text-align:center}
.lk button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:var(--nv);color:#fff;font-size:17px}
.lk .fg{background:none;color:var(--mu);font-size:13px;padding:6px}
#lkMsg{margin-top:8px;color:var(--rd);font-size:14px;min-height:18px}

// ----- Jalali (شمسی) helpers -----
const JMONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
function gregorianToJalali(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=(gy<=1600)?0:979; gy-=(gy<=1600)?621:1600;
  let gy2=(gm>2)?(gy+1):gy;
  let days=(365*gy)+(parseInt((gy2+3)/4))-parseInt((gy2+99)/100)+parseInt((gy2+399)/400)-80+gd+g_d_m[gm-1];
  jy+=33*parseInt(days/12053); days%=12053;
  jy+=4*parseInt(days/1461); days%=1461;
  if(days>365){jy+=parseInt((days-1)/365); days=(days-1)%365;}
  let jm=(days<186)?1+parseInt(days/31):7+parseInt((days-186)/30);
  let jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
function jalaliToGregorian(jy,jm,jd){
  let gy=(jy<=979)?621:1600; jy-=(jy<=979)?0:979;
  let days=(365*jy)+parseInt(jy/33)*8+parseInt(((jy%33)+3)/4)+78+jd+((jm<7)?(jm-1)*31:(jm-7)*30+186);
  gy+=400*parseInt(days/146097); days%=146097;
  if(days>36524){gy+=100*parseInt(--days/36524); days%=36524; if(days>=365)days++;}
  gy+=4*parseInt(days/1461); days%=1461;
  if(days>365){gy+=parseInt((days-1)/365); days=(days-1)%365;}
  let gd=days+1;
  const sal_a=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=0; for(gm=0;gm<13&&gd>sal_a[gm];gm++) gd-=sal_a[gm];
  return [gy,gm,gd];
}
function todayJalali(){
  const n=new Date();
  return gregorianToJalali(n.getFullYear(),n.getMonth()+1,n.getDate());
}
function todayStr(){ // MM-DD jalali for birthday match
  const [jy,jm,jd]=todayJalali();
  return String(jm).padStart(2,"0")+"-"+String(jd).padStart(2,"0");
}
function todayISO(){ // YYYY/MM/DD jalali for attendance & last contact
  const [jy,jm,jd]=todayJalali();
  return jy+"/"+String(jm).padStart(2,"0")+"/"+String(jd).padStart(2,"0");
}
function jDateParts(str){ // parse "YYYY/MM/DD" or "MM-DD"
  if(!str) return null;
  if(str.includes("/")){const p=str.split("/");return {y:+p[0],m:+p[1],d:+p[2]};}
  if(str.includes("-")){const p=str.split("-");return {y:0,m:+p[0],d:+p[1]};}
  return null;
}

function render(){
  const by=document.querySelector("input[name=by]:checked").value, q=norm($("q").value);
  const qDigits = q.replace(/\D/g,"");
  const r=S.filter(s=>{
    if(s.out) return false;
    if(filt.major && s.major!==filt.major) return false;
    if(filt.year && s.year!==filt.year) return false;
    if(!q) return true;
    if(by==="phone"){
      const phones = [s.mob,s.dad,s.mom,s.home].map(p=>norm(p).replace(/\D/g,"")).join(" ");
      return qDigits && phones.includes(qDigits);
    }
    if(by==="ln") return norm(s.ln).includes(q) || norm(s.fn).includes(q);
    if(by==="grade") return norm(s.grade).includes(q);
    return norm(s[by]||"").includes(q);
  }).sort((a,b)=>(a.ln||"").localeCompare(b.ln||"","fa"));
  $("cnt").textContent=r.length+" هنرجو"+(filt.major?" · "+filt.major:"")+(filt.year?" · "+filt.year:"");

function exportVCard(id){
  const s=S.find(x=>x.id===id);if(!s)return;
  const lines=["BEGIN:VCARD","VERSION:3.0",`N:${s.ln||""};${s.fn||""};;;`,`FN:${s.fn||""} ${s.ln||""}`];
  if(s.mob) lines.push(`TEL;TYPE=CELL:${norm(s.mob).replace(/[^\d+]/g,"")}`);
  if(s.dad) lines.push(`TEL;TYPE=VOICE:${norm(s.dad).replace(/[^\d+]/g,"")}`);
  if(s.mom) lines.push(`TEL;TYPE=VOICE:${norm(s.mom).replace(/[^\d+]/g,"")}`);
  if(s.home) lines.push(`TEL;TYPE=HOME:${norm(s.home).replace(/[^\d+]/g,"")}`);

  lines.push("END:VCARD");
  const blob=new Blob([lines.join("\r\n")],{type:"text/vcard"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${s.fn||""}_${s.ln||""}.vcf`;a.click();
  showToast("فایل vCard آماده شد");
}
function copyNum(num){
  if(navigator.clipboard){
    navigator.clipboard.writeText(num).then(()=>showToast("شماره کپی شد")).catch(()=>fallbackCopy(num));
  }else fallbackCopy(num);
}
function fallbackCopy(num){
  const t=document.createElement("textarea");t.value=num;document.body.appendChild(t);t.select();
  try{document.execCommand("copy");showToast("شماره کپی شد")}catch(e){showToast("کپی نشد")}
  document.body.removeChild(t);
}
function showToast(msg){
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t)}
  t.textContent=msg;t.classList.add("show");
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),1800);
}

function exportExcel(){
  if(typeof XLSX==="undefined"){alert("کتابخانه اکسل بارگذاری نشده");return}
  const rows=[["نام","نام خانوادگی","کد ملی","رشته","پایه","سال ورود","تاریخ تولد (ماه-روز)","موبایل","موبایل پدر","موبایل مادر","تلفن ثابت","یادداشت"]];
  S.filter(s=>!s.out).forEach(s=>{
    rows.push([s.fn||"",s.ln||"",s.nid||"",s.major||"",s.grade||"",s.year||"",s.bd||"",s.mob||"",s.dad||"",s.mom||"",s.home||"",s.note||""]);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"هنرجویان");
  XLSX.writeFile(wb,"phonebook-students.xlsx");
  showToast("فایل اکسل دانلود شد");
}
function importExcel(f){
  if(!f||typeof XLSX==="undefined")return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:"array"});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1});
      if(rows.length<2){alert("فایل خالی است");return}
      // Expect header row, then data. Map columns flexibly
      const header=(rows[0]||[]).map(h=>String(h||"").trim());
      const findCol=(names)=>{for(const n of names){const i=header.findIndex(h=>h.includes(n));if(i>=0)return i}return -1};
      const cFn=findCol(["نام","name","first"]);
      const cLn=findCol(["خانوادگی","last","family"]);
      const cNid=findCol(["ملی","nid","کد"]);
      const cMajor=findCol(["رشته","major"]);
      const cGrade=findCol(["پایه","grade"]);
      const cYear=findCol(["سال","year"]);
      const cBd=findCol(["تولد","birth","bd"]);
      const cMob=findCol(["موبایل هنرجو","موبایل","mobile","mob"]);
      let updated=0, added=0;
      for(let i=1;i<rows.length;i++){
        const r=rows[i];if(!r||!r.length)continue;
        const ln=cLn>=0?norm(r[cLn]):"";
        const fn=cFn>=0?norm(r[cFn]):"";
        if(!ln&&!fn)continue;
        const nid=cNid>=0?norm(r[cNid]):"";
        let existing=null;
        if(nid) existing=S.find(x=>x.nid===nid&&!x.out);
        if(!existing&&ln) existing=S.find(x=>norm(x.ln)===ln&&norm(x.fn)===fn&&!x.out);
        if(existing){
          if(cBd>=0&&r[cBd]) existing.bd=String(r[cBd]).trim();
          if(cMob>=0&&r[cMob]) existing.mob=norm(r[cMob]);
          if(cMajor>=0&&r[cMajor]) existing.major=norm(r[cMajor]);
          if(cGrade>=0&&r[cGrade]) existing.grade=String(r[cGrade]).trim();
          updated++;
        }else{
          const o={id:uid(),fn,ln,nid,major:cMajor>=0?norm(r[cMajor]):"",grade:cGrade>=0?String(r[cGrade]).trim():"",year:cYear>=0?norm(r[cYear]):CURY(),bd:cBd>=0?String(r[cBd]||"").trim():"",mob:cMob>=0?norm(r[cMob]):"",dad:"",mom:"",home:"",note:"",lc:"",ey:1};
          S.push(o);added++;
        }
      }
      save();closeSheet();render();
      alert(`به‌روزرسانی: ${updated} | جدید: ${added}`);
    }catch(err){alert("خطا در خواندن فایل: "+err.message)}
  };
  reader.readAsArrayBuffer(f);
}

function showStats(){
  const active = S.filter(s=>!s.out);
  const byMajor = {};
  const byGrade = {};
  let missMob=0, missDad=0, missMom=0, missHome=0; let badPh=0;
  const incomplete = [];
  active.forEach(s=>{
    byMajor[s.major] = (byMajor[s.major]||0)+1;
    byGrade[s.grade] = (byGrade[s.grade]||0)+1;
    const missing = [];
    if(!s.mob){missMob++; missing.push("موبایل هنرجو")}
    if(!s.dad){missDad++; missing.push("پدر")}
    if(!s.mom){missMom++; missing.push("مادر")}
    if(!s.home){missHome++; missing.push("ثابت")}
    [["mob","موبایل هنرجو",/^09\d{9}$/],["dad","موبایل پدر",/^09\d{9}$/],["mom","موبایل مادر",/^09\d{9}$/],["home","تلفن ثابت",/^0\d{10}$/]].forEach(([k,lb,re])=>{if(s[k]&&!re.test(String(s[k]).replace(/\D/g,""))){badPh++;missing.push(lb+" ⚠️ رقم کم/زیاد")}});
    if(missing.length) incomplete.push({s, missing});
  });
  const majorHtml = Object.entries(byMajor).sort((a,b)=>b[1]-a[1]).map(([m,c])=>`<div class="stat-card"><b>${c}</b><span>${esc(m)}</span></div>`).join("") || "<div class='empty'>—</div>";
  const gradeHtml = Object.entries(byGrade).sort((a,b)=>a[0].localeCompare(b[0])).map(([g,c])=>`<div class="stat-card"><b>${c}</b><span>پایه ${esc(g)}</span></div>`).join("") || "<div class='empty'>—</div>";
  const missHtml = incomplete.length ? incomplete.map(({s,missing})=>`
    <div class="miss-item" onclick="closeSheet();detail('${s.id}')">
      <div><b>${esc(s.fn)} ${esc(s.ln)}</b><br><small style="color:var(--mu)">${esc(s.major||"")} · پایه ${esc(s.grade||"")}</small></div>
      <div class="tags">${missing.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
    </div>`).join("") : '<div class="empty" style="padding:20px">همه شماره‌ها کامل هستند ✅</div>';

  openPage("book",`<h2>📊 آمار و نواقص</h2>
  <div class="kv"><span>کل هنرجویان فعال</span><span><b>${active.length}</b></span></div>
  <h3 style="margin:16px 0 8px;font-size:15px;color:var(--mu)">به تفکیک رشته</h3>
  <div class="stat-grid">${majorHtml}</div>
  <h3 style="margin:16px 0 8px;font-size:15px;color:var(--mu)">به تفکیک پایه</h3>
  <div class="stat-grid">${gradeHtml}</div>
  <h3 style="margin:16px 0 8px;font-size:15px;color:var(--mu)">شماره‌های ناقص</h3>
  <div class="stat-grid">
    <div class="stat-card"><b style="color:${missMob?'#c94545':'#2e8f5b'}">${missMob}</b><span>بدون موبایل</span></div>
    <div class="stat-card"><b style="color:${missDad?'#c94545':'#2e8f5b'}">${missDad}</b><span>بدون پدر</span></div>
    <div class="stat-card"><b style="color:${missMom?'#c94545':'#2e8f5b'}">${missMom}</b><span>بدون مادر</span></div>
    <div class="stat-card"><b style="color:${missHome?'#c94545':'#2e8f5b'}">${missHome}</b><span>بدون ثابت</span></div>
    <div class="stat-card"><b style="color:${badPh?'#c94545':'#2e8f5b'}">${badPh}</b><span>شماره با رقم کم/زیاد</span></div>
  </div>
  <div class="miss-list">${missHtml}</div>
  `);
}

    </div>`).join(""):'<div class="empty">متولدی در این روز ثبت نشده</div>'}
  <button class="btn s" onclick="closeSheet()">بستن</button>`);
}

function showAttendance(){
  const majors = Object.keys(MAJORS);
  const [jy,jm,jd] = todayJalali();
  const today = todayISO();
  openPage("att",`<h2>📋 حضور و غیاب</h2>
  <div class="f"><label>رشته</label><select id="attMajor"><option value="">— انتخاب —</option>${majors.map(m=>`<option>${m}</option>`).join("")}</select></div>
  <div class="f"><label>پایه</label><select id="attGrade"><option value="">—</option><option>10</option><option>11</option><option>12</option></select></div>
  <div class="f"><label>تاریخ (شمسی)</label>
    <div class="date-row" style="margin:0">
      <select id="attY">${[jy,jy-1].map(y=>`<option value="${y}" ${y===jy?"selected":""}>${y}</option>`).join("")}</select>
      <select id="attM">${JMONTHS.map((name,i)=>`<option value="${i+1}" ${i+1===jm?"selected":""}>${name}</option>`).join("")}</select>
      <select id="attD">${[...Array(31)].map((_,i)=>`<option value="${i+1}" ${i+1===jd?"selected":""}>${i+1}</option>`).join("")}</select>
    </div>
  </div>
  <button class="btn" onclick="loadAttList()">نمایش لیست</button>
  <div id="attList"></div>
  <button class="btn s" style="margin-top:16px" onclick="showMonthReport()">📊 گزارش ماهانه غیبت</button>
  `);
}
function attDateStr(){
  const y=$("attY").value, m=String($("attM").value).padStart(2,"0"), d=String($("attD").value).padStart(2,"0");
  return y+"/"+m+"/"+d;
}
function loadAttList(){
  const major=$("attMajor").value, grade=$("attGrade").value, date=attDateStr();
  if(!major&&!grade){alert("رشته یا پایه را انتخاب کنید");return}
  const students=S.filter(s=>!s.out&&(!major||s.major===major)&&(!grade||String(s.grade)===String(grade))).sort((a,b)=>(a.ln||"").localeCompare(b.ln||"","fa"));
  if(!ATT[date]) ATT[date]={};
  const abs=ATT[date];
  $("attList").innerHTML=`<div class="cnt">${students.length} هنرجو · ${date}</div>
  ${students.map(s=>`<div class="att-row"><label><input type="checkbox" data-id="${s.id}" ${abs[s.id]?"checked":""}> <b>${esc(s.fn)} ${esc(s.ln)}</b></label></div>`).join("")||'<div class="empty">هنرجویی یافت نشد</div>'}
  <button class="btn g" onclick="saveAttList('${date}')">💾 ذخیره غیبت‌ها</button>`;
}
function saveAttList(date){
  if(!ATT[date]) ATT[date]={};
  $("attList").querySelectorAll("input[type=checkbox]").forEach(cb=>{
    if(cb.checked) ATT[date][cb.dataset.id]=true;
    else delete ATT[date][cb.dataset.id];
  });
  // clean empty dates
  if(Object.keys(ATT[date]).length===0) delete ATT[date];
  saveAtt();showToast("غیبت‌ها ذخیره شد");
}
function showMonthReport(){
  const [jy,jm] = todayJalali();
  openPage("att",`<h2>📊 گزارش غیبت ماهانه</h2>
  <div class="date-row">
    <select id="repMonth"><option value="0">کل سال</option>${JMONTHS.map((name,i)=>`<option value="${i+1}" ${i+1===jm?"selected":""}>${name}</option>`).join("")}</select>
    <select id="repYear"><option value="${jy}" selected>${jy}</option><option value="${jy-1}">${jy-1}</option></select>
    <button class="btn" style="flex:none;width:auto;padding:10px 14px;margin:0" onclick="runMonthReport()">نمایش</button>
  </div>
  <div id="repResult"></div>
  `);
}
function runMonthReport(){
  const month=+$("repMonth").value, year=+$("repYear").value;
  const prefix=month?`${year}/${String(month).padStart(2,"0")}`:`${year}/`;
  const counts={};
  Object.keys(ATT).filter(d=>d.startsWith(prefix)).forEach(d=>{
    Object.keys(ATT[d]).forEach(id=>{counts[id]=(counts[id]||0)+1});
  });
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(!sorted.length){$("repResult").innerHTML='<div class="empty">در این ماه غیبتی ثبت نشده</div>';return}
  $("repResult").innerHTML=`<div class="cnt">${sorted.length} نفر دارای غیبت</div>
  <div class="month-report">${sorted.map(([id,c])=>{
    const s=S.find(x=>x.id===id)||{};
    return `<div class="report-item"><span>${esc(s.fn||"")} ${esc(s.ln||"")} <small style="color:var(--mu)">${esc(s.major||"")} ${esc(s.grade||"")}</small></span><b>${c} روز</b></div>`;
  }).join("")}</div>
  <button class="btn s" onclick="exportAttReport(${year},${month})">📥 خروجی این گزارش</button>`;
}
function exportAttReport(year,month){
  const prefix=month?`${year}/${String(month).padStart(2,"0")}`:`${year}/`;
  const counts={};
  Object.keys(ATT).filter(d=>d.startsWith(prefix)).forEach(d=>{
    Object.keys(ATT[d]).forEach(id=>{counts[id]=(counts[id]||0)+1});
  });
  const rows=[["نام","نام خانوادگی","رشته","پایه","تعداد غیبت"]];
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([id,c])=>{
    const s=S.find(x=>x.id===id)||{};
    rows.push([s.fn||"",s.ln||"",s.major||"",s.grade||"",c]);
  });
  if(typeof XLSX!=="undefined"){
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"غیبت");
    XLSX.writeFile(wb,`absence-${year}-${month}.xlsx`);
    showToast("گزارش اکسل دانلود شد");
  }else{
    // fallback csv
    const csv=rows.map(r=>r.join(",")).join("\\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`absence-${year}-${month}.csv`;a.click();
  }
}

async function decSeed(pw){
  if(!(window.crypto&&crypto.subtle))throw new Error("nosub");const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  let last=new Error("bad");
  for(const E of ENC){try{
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(E.s),iterations:E.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(E.i)},k,b(E.c))));
  }catch(e){last=e}}
  throw last;
}
