function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function openApp(){
  const err=document.getElementById('err');err.textContent='';
  if(!window.crypto||!crypto.subtle){err.textContent='این مرورگر از رمزگشایی پشتیبانی نمی‌کند. فایل را با Chrome باز کنید.';return}
  try{
    const raw=b64(P),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(e){err.textContent='رمز اشتباه است.'}
}
document.getElementById('go').onclick=openApp;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')openApp()});
